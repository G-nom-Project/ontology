name: g-nom_ontology
description: Ontology used by G-nom's RDF triple store.
title: g-nom_ontology
see_also:
- https://G-nom-Project.github.io/g-nom_ontology
id: https://w3id.org/G-nom-Project/g-nom_ontology
imports:
- linkml:types
license: MIT
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  gnom:
    prefix_prefix: gnom
    prefix_reference: https://example.org/g-nom/
  biolink:
    prefix_prefix: biolink
    prefix_reference: https://w3id.org/biolink/vocab/
  rdfs:
    prefix_prefix: rdfs
    prefix_reference: http://www.w3.org/2000/01/rdf-schema#
  NCBITaxon:
    prefix_prefix: NCBITaxon
    prefix_reference: http://purl.obolibrary.org/obo/NCBITaxon_
  ro:
    prefix_prefix: ro
    prefix_reference: http://purl.obolibrary.org/obo/RO_
  WIKIDATA_PROPERTY:
    prefix_prefix: WIKIDATA_PROPERTY
    prefix_reference: https://www.wikidata.org/prop/
default_prefix: gnom
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
slots:
  id:
    name: id
    definition_uri: https://example.org/g-nom/id
    description: Entity IRI, minted from the base url, the class's ID prefix and the
      database ID.
    from_schema: https://w3id.org/G-nom-Project/g-nom_ontology
    slot_uri: gnom:id
    identifier: true
    owner: GeneTaxonomicAssignment
    domain_of:
    - Assembly
    - Taxon
    - TaxaminerAnalysis
    - GeneTaxonomicAssignment
    range: uriorcurie
    required: true
  name:
    name: name
    definition_uri: https://example.org/g-nom/name
    description: Name of this object
    from_schema: https://w3id.org/G-nom-Project/g-nom_ontology
    mappings:
    - rdfs:label
    slot_uri: rdfs:label
    owner: TaxaminerAnalysis
    domain_of:
    - Assembly
    - Taxon
    - TaxaminerAnalysis
    range: string
  scientific_name:
    name: scientific_name
    definition_uri: https://example.org/g-nom/scientific_name
    description: A human-readable, scientific name for a thing
    from_schema: https://w3id.org/G-nom-Project/g-nom_ontology
    is_a: name
    slot_uri: gnom:scientific_name
    owner: Taxon
    domain_of:
    - Taxon
    range: string
  in_assembly:
    name: in_assembly
    definition_uri: https://example.org/g-nom/in_assembly
    description: The assembly that was analysed.
    from_schema: https://w3id.org/G-nom-Project/g-nom_ontology
    mappings:
    - gnom:in_assembly
    slot_uri: gnom:in_assembly
    owner: TaxaminerAnalysis
    domain_of:
    - TaxaminerAnalysis
    range: Assembly
  fasta_header:
    name: fasta_header
    definition_uri: https://example.org/g-nom/fasta_header
    description: FASTA header of the gene sequence as it appears in the analysed assembly.
    from_schema: https://w3id.org/G-nom-Project/g-nom_ontology
    mappings:
    - gnom:fasta_header
    slot_uri: gnom:fasta_header
    owner: GeneTaxonomicAssignment
    domain_of:
    - GeneTaxonomicAssignment
    range: string
  emitter:
    name: emitter
    definition_uri: https://example.org/g-nom/emitter
    description: The analysis that produced this assignment.
    from_schema: https://w3id.org/G-nom-Project/g-nom_ontology
    mappings:
    - gnom:emitter
    slot_uri: gnom:emitter
    owner: GeneTaxonomicAssignment
    domain_of:
    - GeneTaxonomicAssignment
    range: TaxaminerAnalysis
  in_taxon:
    name: in_taxon
    definition_uri: https://example.org/g-nom/in_taxon
    description: Link to a taxon (see the class's own usage for the exact meaning).
    from_schema: https://w3id.org/G-nom-Project/g-nom_ontology
    mappings:
    - gnom:in_taxon
    exact_mappings:
    - RO:0002162
    - WIKIDATA_PROPERTY:P703
    - biolink:in_taxon
    narrow_mappings:
    - RO:0002160
    slot_uri: gnom:in_taxon
    owner: GeneTaxonomicAssignment
    domain_of:
    - Assembly
    - GeneTaxonomicAssignment
    range: Taxon
  parent_taxon:
    name: parent_taxon
    definition_uri: https://example.org/g-nom/parent_taxon
    from_schema: https://w3id.org/G-nom-Project/g-nom_ontology
    slot_uri: gnom:parent_taxon
    owner: Taxon
    domain_of:
    - Taxon
    range: Taxon
  GeneTaxonomicAssignment_in_taxon:
    name: GeneTaxonomicAssignment_in_taxon
    definition_uri: https://example.org/g-nom/in_taxon
    description: The taxon this gene was assigned to by the analysis.
    from_schema: https://w3id.org/G-nom-Project/g-nom_ontology
    mappings:
    - gnom:in_taxon
    exact_mappings:
    - RO:0002162
    - WIKIDATA_PROPERTY:P703
    - biolink:in_taxon
    narrow_mappings:
    - RO:0002160
    is_a: in_taxon
    domain: GeneTaxonomicAssignment
    slot_uri: gnom:in_taxon
    alias: in_taxon
    owner: GeneTaxonomicAssignment
    domain_of:
    - GeneTaxonomicAssignment
    is_usage_slot: true
    usage_slot_name: in_taxon
    range: Taxon
    required: true
  GeneTaxonomicAssignment_emitter:
    name: GeneTaxonomicAssignment_emitter
    definition_uri: https://example.org/g-nom/emitter
    description: The analysis that produced this assignment.
    from_schema: https://w3id.org/G-nom-Project/g-nom_ontology
    mappings:
    - gnom:emitter
    is_a: emitter
    domain: GeneTaxonomicAssignment
    slot_uri: gnom:emitter
    alias: emitter
    owner: GeneTaxonomicAssignment
    domain_of:
    - GeneTaxonomicAssignment
    is_usage_slot: true
    usage_slot_name: emitter
    range: TaxaminerAnalysis
    required: true
classes:
  Assembly:
    name: Assembly
    definition_uri: https://example.org/g-nom/Assembly
    description: 'A genomic or metagenomic assembly. IRI pattern: {app.url}/assemblies/{id}.'
    from_schema: https://w3id.org/G-nom-Project/g-nom_ontology
    slots:
    - id
    - name
    - in_taxon
    class_uri: gnom:Assembly
  Taxon:
    name: Taxon
    definition_uri: https://example.org/g-nom/Taxon
    description: A taxonomic unit based on the NCBI taxonomy scheme.
    from_schema: https://w3id.org/G-nom-Project/g-nom_ontology
    narrow_mappings:
    - biolink:OrganismTaxon
    slots:
    - id
    - name
    - scientific_name
    - parent_taxon
    class_uri: gnom:Taxon
  TaxaminerAnalysis:
    name: TaxaminerAnalysis
    definition_uri: https://example.org/g-nom/TaxaminerAnalysis
    description: A single analysis run using taXaminer.
    from_schema: https://w3id.org/G-nom-Project/g-nom_ontology
    exact_mappings:
    - gnom:TaxaminerAnalysis
    slots:
    - id
    - name
    - in_assembly
    class_uri: gnom:TaxaminerAnalysis
  GeneTaxonomicAssignment:
    name: GeneTaxonomicAssignment
    definition_uri: https://example.org/g-nom/GeneTaxonomicAssignment
    description: The taxonomic assignment of one gene within one taXaminer analysis.
      Genes labelled "Unassigned" in the source table are not represented.
    from_schema: https://w3id.org/G-nom-Project/g-nom_ontology
    exact_mappings:
    - gnom:GeneTaxonomicAssignment
    slots:
    - id
    - GeneTaxonomicAssignment_in_taxon
    - fasta_header
    - GeneTaxonomicAssignment_emitter
    slot_usage:
      in_taxon:
        name: in_taxon
        description: The taxon this gene was assigned to by the analysis.
        required: true
      emitter:
        name: emitter
        required: true
    class_uri: gnom:GeneTaxonomicAssignment
metamodel_version: 1.12.0
