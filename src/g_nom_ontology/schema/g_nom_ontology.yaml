---
id: https://w3id.org/G-nom-Project/g-nom_ontology
name: g-nom_ontology
title: g-nom_ontology
description: |-
  Ontology used by G-nom's RDF triple store.
license: MIT
see_also:
  - https://G-nom-Project.github.io/g-nom_ontology

prefixes:
  linkml: https://w3id.org/linkml/
  gnom: https://example.org/g-nom/
  biolink: https://w3id.org/biolink/vocab/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  ro: http://purl.obolibrary.org/obo/RO_
  WIKIDATA_PROPERTY: https://www.wikidata.org/prop/
default_prefix: gnom
default_range: string

imports:
  - linkml:types

classes:
  Assembly:
    description: >-
      A genomic or metagenomic assembly.
      IRI pattern: {app.url}/assemblies/{id}.
    slots:
      - id
      - name
      - in_taxon

  Taxon:
    narrow_mappings:
      biolink:OrganismTaxon
    description: >-
      A taxonomic unit based on the NCBI taxonomy scheme.
    slots:
      - id
      - name
      - scientific_name
      - parent_taxon

  TaxaminerAnalysis:
    class_uri: gnom:TaxaminerAnalysis
    description: >-
      A single analysis run using taXaminer.
    slots:
      - id
      - name
      - in_assembly

  GeneTaxonomicAssignment:
    class_uri: gnom:GeneTaxonomicAssignment
    description: >-
      The taxonomic assignment of one gene within one taXaminer analysis.
      Genes labelled "Unassigned" in the source table are not represented.
    slots:
      - id
      - in_taxon
      - fasta_header
      - emitter
    slot_usage:
      in_taxon:
        required: true
        description: The taxon this gene was assigned to by the analysis.
      emitter:
        required: true

slots:
  id:
    identifier: true
    range: uriorcurie
    description: Entity IRI, minted from the base url, the class's ID prefix and the database ID.

  name:
    slot_uri: rdfs:label
    range: string
    description: Name of this object

  scientific_name:
    is_a: name
    description: A human-readable, scientific name for a thing

  in_assembly:
    slot_uri: gnom:in_assembly
    range: Assembly
    description: The assembly that was analysed.

  fasta_header:
    slot_uri: gnom:fasta_header
    range: string
    description: >-
      FASTA header of the gene sequence as it appears in the analysed assembly.

  emitter:
    slot_uri: gnom:emitter
    range: TaxaminerAnalysis
    description: The analysis that produced this assignment.

  in_taxon:
    slot_uri: gnom:in_taxon
    range: Taxon
    description: Link to a taxon (see the class's own usage for the exact meaning).
    exact_mappings:
      - RO:0002162
      - WIKIDATA_PROPERTY:P703
      - biolink:in_taxon
    narrow_mappings:
      - RO:0002160

  parent_taxon:
    range: Taxon